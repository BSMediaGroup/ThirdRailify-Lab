function duplicateSelected(){if(!state.selected.size)return;let newIds=[];mutate('Duplicate objects',b=>{const ids=M.descendants(b,state.selected),map=new Map();for(const id of ids)map.set(id,M.id());const additions=b.objects.filter(n=>ids.has(n.id)).map(n=>{const q=M.clone(n);q.id=map.get(n.id);if(map.has(n.parentId))q.parentId=map.get(n.parentId);else{q.x+=28;q.y+=28;}q.locked=false;return q;});newIds=additions.filter(n=>state.selected.has([...map].find(([old,id])=>id===n.id)?.[0])).map(n=>n.id);b.objects.push(...additions);b.edges.push(...b.edges.filter(e=>map.has(e.from.nodeId)&&map.has(e.to.nodeId)).map(e=>({...M.clone(e),id:M.id(),from:{nodeId:map.get(e.from.nodeId)},to:{nodeId:map.get(e.to.nodeId)}})));});state.selected=new Set(newIds);refreshSelection();}

function modal(title,body,footer='',wide=false){closeModal();const focus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><div><span class="eyebrow">THIRD RAILIFY / NOTESPACE</span><h2 id="modal-title">${esc(title)}</h2></div>${button('close-modal','close','Close dialog')}</header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;state.modal={focus};setTimeout(()=>$('.modal input:not([type=hidden]),.modal textarea,.modal button')?.focus(),30);$('.modal-backdrop').addEventListener('pointerdown',e=>{if(e.target===e.currentTarget)closeModal();});}

async function gifFetch(url){const response=await fetch(url,{signal:AbortSignal.timeout(15000),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw Error(response.status===429?'GIF provider rate limit reached. Wait before searching again.':`GIF provider returned HTTP ${response.status}. Check the client key and provider access.`);return response.json();}

 }catch(err){if(state.modal===modalState)container.innerHTML=`<div class="warning spaced">${esc(err.message)} No automatic retries were made.</div>`;}

async function addProviderGIF(i){const g=state.modal.gifResults[i];if(!g||!M.safeURL(g.url))throw Error('The provider did not return a usable HTTPS rendition.');const p=centerPoint(),w=Math.min(360,g.width),h=w*g.height/g.width;const n=M.node('media',{title:g.title,provider:g.provider,providerId:g.id,source:M.safeURL(g.source),url:null,mime:'image/gif',x:p.x-w/2,y:p.y-h/2,w,h:h+32,owner:state.identity,tags:['gif',g.provider]});state.remoteMedia.set(n.id,{url:g.url});mutate('Add provider GIF',b=>b.objects.push(n));closeModal();select(n.id);

async function resolveGIF(id){const n=state.board.objects.find(n=>n.id===id);if(!n?.provider)return;const key=getGifKey(n.provider);if(!key){gifSettings();toast('A client key is needed to load the saved provider reference.');return;}try{let url;if(n.provider==='giphy'){const u=new URL('https://api.giphy.com/v1/gifs/'+encodeURIComponent(n.providerId));u.searchParams.set('api_key',key);const d=await gifFetch(u);url=d.data?.images?.original?.url;}else{const u=new URL('https://tenor.googleapis.com/v2/posts');u.search=new URLSearchParams({ids:n.providerId,key,client_key:'thirdrailify_notespace_poc',media_filter:'gif'});const d=await gifFetch(u);url=d.results?.[0]?.media_formats?.gif?.url;}if(!M.safeURL(url))throw Error('The provider rendition is no longer available.');state.remoteMedia.set(id,{url});render();}catch(err){toast(err.message,'error');}}
function sanitizeSVG(text){if(/<!doctype|<!entity/i.test(text))throw Error('SVG document entities are not supported.');const doc=new DOMParser().parseFromString(text,'image/svg+xml');if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg')throw Error('This is not a valid SVG image.');for(const e of doc.querySelectorAll('*')){if(['script','foreignObject','iframe','object','embed','audio','video'].includes(e.localName))throw Error('This SVG includes active content. Export it as a clean SVG or PNG.');for(const a of Array.from(e.attributes)){if(/^on/i.test(a.name)||(/href$/i.test(a.name)&&a.value&&!a.value.startsWith('#'))||/url\(\s*["']?(?!#)/i.test(a.value))throw Error('SVG scripts or external resources are not supported.');}if(e.localName==='style'&&/@import|url\(\s*["']?(?!#)/i.test(e.textContent))throw Error('External SVG style resources are not supported.');}return new XMLSerializer().serializeToString(doc);}
async function inspectImage(blob,name){if(blob.size>20*1024*1024)throw Error(`${name}: maximum 20 MB per image.`);let mime=blob.type;const ext=name.split('.').pop()?.toLowerCase();if(!mime){mime=({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',avif:'image/avif',bmp:'image/bmp',ico:'image/x-icon'})[ext];blob=new Blob([blob],{type:mime||'application/octet-stream'});}if(!/^image\/(png|jpeg|webp|gif|avif|bmp|svg\+xml|x-icon|vnd.microsoft.icon)$/.test(mime))throw Error(`${name}: use PNG, JPG, WebP, GIF, AVIF, BMP, ICO or SVG.`);if(mime==='image/svg+xml')blob=new Blob([sanitizeSVG(await blob.text())],{type:mime});const url=URL.createObjectURL(blob);try{const dimensions=await new Promise((resolve,reject)=>{const img=new Image(),timer=setTimeout(()=>reject(Error('Image decoding timed out.')),10000);img.onload=()=>{clearTimeout(timer);resolve({w:img.naturalWidth,h:img.naturalHeight});};img.onerror=()=>{clearTimeout(timer);reject(Error(name+': this browser cannot decode the image.'));};img.src=url;});if(!dimensions.w||!dimensions.h||dimensions.w>20000||dimensions.h>20000||dimensions.w*dimensions.h>80000000)throw Error('This image is too large for the POC canvas.');return{blob,...dimensions};}finally{URL.revokeObjectURL(url);}}
async function addLocalFile(file,point=null,replaceId=null){const verified=await inspectImage(file,file.name||'image'),a=await storeBlob(verified.blob,file.name||'image');const p=point||centerPoint();const w=Math.max(100,Math.min(380,verified.w)),h=w*verified.h/verified.w;let n;mutate('Add local media',b=>{if(replaceId){n=b.objects.find(n=>n.id===replaceId);if(n){Object.assign(n,{assetId:a.id,provider:null,providerId:null,url:null,fileName:a.name,mime:a.mime,w,h:h+32});return;}}n=M.node('media',{title:file.name||'Image',fileName:a.name,mime:a.mime,assetId:a.id,url:null,x:p.x-w/2,y:p.y-h/2,w,h:h+32,owner:state.identity,tags:[]});b.objects.push(n);});select(n.id);return n;}
$('#media-file').addEventListener('change',async e=>{const files=Array.from(e.target.files),replace=state.replaceImageId;state.replaceImageId=null;closeModal();let i=0;for(const file of files){try{const p=centerPoint();p.x+=i*22;p.y+=i*22;await addLocalFile(file,p,i===0?replace:null);i++;}catch(err){toast(err.message,'error');}}e.target.value='';if(i)toast(`${i} image${i===1?'':'s'} saved with original bytes.`, 'success');});
$('#background-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const v=await inspectImage(file,file.name),a=await storeBlob(v.blob,file.name);if(state.modal){state.modal.bgImageId=a.id;$('#bg-file-label').textContent=file.name+' · ready';}}catch(err){toast(err.message,'error');}e.target.value='';});
async function addURL(){const url=M.safeURL($('#media-url').value.trim());if(!url){toast('Use a direct public HTTPS image URL without credentials.','error');return;}const h=new URL(url).hostname;if(h==='giphy.com'||h.endsWith('.giphy.com')){toast('Use the GIPHY tab to keep a provider ID instead of storing its media URL.','error');return;}const dims=await new Promise((resolve,reject)=>{const image=new Image(),timer=setTimeout(()=>reject(Error('Image host did not respond. Try uploading the file.')),12000);image.referrerPolicy='no-referrer';image.onload=()=>{clearTimeout(timer);resolve({w:image.naturalWidth,h:image.naturalHeight});};image.onerror=()=>{clearTimeout(timer);reject(Error('This URL is not a loadable image, or the host blocked it.'));};image.src=url;});const p=centerPoint(),w=340;const n=M.node('media',{title:'Image reference',url,mime:url.split('?')[0].endsWith('.gif')?'image/gif':'image',x:p.x-w/2,y:p.y-100,w,h:w*dims.h/dims.w+32,owner:state.identity,source:url});mutate('Add image URL',b=>b.objects.push(n));closeModal();select(n.id);}
async function addBundledArt(which){const data=NSSeed[which],mime=which==='spark'?'image/gif':'image/svg+xml';const blob=await(await fetch(data)).blob();const file=new File([blob],which+(which==='spark'?'.gif':'.svg'),{type:mime});closeModal();await addLocalFile(file);}
$('#viewport').addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});$('#viewport').addEventListener('drop',async e=>{e.preventDefault();const files=Array.from(e.dataTransfer.files);for(let i=0;i<files.length;i++){try{const p=worldPoint(e);p.x+=i*20;p.y+=i*20;await addLocalFile(files[i],p);}catch(err){toast(err.message,'error');}}});
document.addEventListener('paste',async e=>{if(inputContext(e)||state.modal)return;const images=Array.from(e.clipboardData?.items||[]).filter(i=>i.kind==='file'&&i.type.startsWith('image/'));if(images.length){e.preventDefault();for(const item of images)try{await addLocalFile(item.getAsFile());}catch(err){toast(err.message,'error');}}else{const text=e.clipboardData?.getData('text/plain');if(text?.trim()){e.preventDefault();const n=createObject('note');mutate('Paste note',()=>{n.title=text.split('\n')[0].slice(0,140);n.text=text.slice(n.title.length).trim().slice(0,10000);});}}});
function exportModal(){modal('Keep a copy of the good stuff',`<div class="helper-card">${icon('download')}<strong>Notespace file · editable backup</strong>Includes the board structure, notes, tasks, fields and locally uploaded media. GIFs retain their original bytes. Provider GIFs export only their IDs; external images remain external references.</div><button class="gold-button full spaced" data-action="export-json">${icon('download')} Export editable Notespace</button><div class="inspector-section"><div class="helper-card"><strong>PNG · a still canvas overview</strong>Captures notes and card layouts. Local GIFs export as a still frame. External or provider images are shown as labeled placeholders to avoid copying provider assets or tainting the canvas.</div><button class="quiet-button full spaced" data-action="export-png">${icon('image')} Export PNG overview</button></div><div class="inspector-section"><button class="secondary-button full" data-action="import-json">${icon('upload')} Import a Notespace file</button><p class="compact-info">Imports always create a new board code. Your current board is not overwritten.</p></div>`,'<button class="quiet-button" data-action="close-modal">Done</button>');}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
async function blobData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});}
async function exportBoard(){await state.saveQueue;const b=M.clone(state.board),ids=new Set(b.objects.filter(n=>n.assetId).map(n=>n.assetId));if(b.background.imageId)ids.add(b.background.imageId);const assets=[];for(const id of ids){const a=await dbGet('assets',id);if(a)assets.push({id,name:a.name,mime:a.mime,data:await blobData(a.blob)});}const payload={format:'thirdrailify-notespace',version:1,exportedAt:new Date().toISOString(),board:b,assets};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});download(blob,(b.title.replace(/[^a-z0-9 -]/gi,'').trim()||'notespace')+'.notespace.json');toast('Editable board exported with '+assets.length+' local media files.','success');}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>100*1024*1024)throw Error('Board import limit is 100 MB.');const payload=JSON.parse(await file.text());if(payload.format!=='thirdrailify-notespace'||payload.version!==1)throw Error('Choose an exported Notespace JSON file.');const b=M.validate(payload.board),map=new Map();if(!Array.isArray(payload.assets)||payload.assets.length>200)throw Error('Invalid media collection.');
 const verified=[];for(const a of payload.assets){if(!a||typeof a.id!=='string'||!/^data:image\/[a-z0-9.+-]+;base64,/i.test(a.data||''))throw Error('Invalid embedded image.');const blob=await(await fetch(a.data)).blob();const v=await inspectImage(blob,a.name||'image');verified.push({...a,blob:v.blob});}
 for(const a of verified){const stored=await storeBlob(a.blob,a.name);map.set(a.id,stored.id);}for(const n of b.objects)if(n.assetId)n.assetId=map.get(n.assetId)||null;if(b.background.imageId)b.background.imageId=map.get(b.background.imageId)||null;do{b.id=M.slug();}while(await dbGet('boards',b.id));b.title+=' · imported';await dbPut('boards',b);closeModal();await loadBoard(b.id);toast('Board imported under a new code. Existing boards were not changed.','success');}catch(err){toast('Import stopped: '+err.message,'error');}e.target.value='';});
async function exportPNG(){await state.saveQueue;const b=state.board,box=M.bounds(b),pad=40,scale=Math.min(2,5000/(box.w+pad*2),4000/(box.h+pad*2));const canvas=document.createElement('canvas');canvas.width=Math.ceil((box.w+pad*2)*scale);canvas.height=Math.ceil((box.h+pad*2)*scale);const ctx=canvas.getContext('2d');ctx.fillStyle=b.background.color;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.scale(scale,scale);ctx.translate(pad-box.x,pad-box.y);const map=M.index(b);
 function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
 function text(content,x,y,w,size,color,maxLines=5,bold=false){ctx.font=`${bold?'600 ':''}${size}px Segoe UI,Arial,sans-serif`;ctx.fillStyle=color;let row=0;for(const para of String(content||'').split('\n')){let line='';for(const word of para.split(' ')){const next=line?line+' '+word:word;if(ctx.measureText(next).width>w&&line){if(row>=maxLines)return;ctx.fillText(line,x,y+row*size*1.4);row++;line=word;}else line=next;}if(row>=maxLines)return;ctx.fillText(line,x,y+row*size*1.4);row++;}}
 async function draw(n){const p=M.worldPosition(n,map);if(n.type==='frame'){rounded(p.x,p.y,n.w,n.h,12,'#1c1b21',n.tint);text(n.title,p.x+18,p.y+29,n.w-35,13,n.tint,1,true);for(const child of b.objects.filter(x=>x.parentId===n.id)){if(n.clip){ctx.save();ctx.beginPath();ctx.rect(p.x,p.y,n.w,n.h);ctx.clip();await draw(child);ctx.restore();}else await draw(child);}return;}
 if(n.type==='text'){text(n.title,p.x,p.y+40,n.w,n.fontSize||44,n.ink,4,true);text(n.text,p.x,p.y+n.h-9,n.w,14,'#aaa3b6',3);return;}
 if(n.type==='drawing'){ctx.strokeStyle=n.tint;ctx.lineWidth=n.strokeWidth||3;ctx.beginPath();n.points.forEach((v,i)=>i?ctx.lineTo(p.x+v[0],p.y+v[1]):ctx.moveTo(p.x+v[0],p.y+v[1]));ctx.stroke();return;}
 rounded(p.x,p.y,n.w,n.h,10,n.fill||'#24202b',n.tint);if(n.type==='media'){const src=n.assetId?state.urls.get(n.assetId):null;if(src){try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});const ratio=Math.min(n.w/img.naturalWidth,(n.h-32)/img.naturalHeight),w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;ctx.drawImage(img,p.x+(n.w-w)/2,p.y+(n.h-32-h)/2,w,h);}catch{}}else text('External media reference',p.x+15,p.y+35,n.w-30,14,'#bca3d0',3);text(n.title,p.x+10,p.y+n.h-11,n.w-20,10,'#d2bddc',1);return;}
 if(n.type==='checklist'){text(n.title,p.x+18,p.y+33,n.w-36,22,n.ink,2,true);let y=p.y+92;for(const t of n.items||[]){if(y>p.y+n.h-25)break;rounded(p.x+18,y-12,15,15,3,t.done?'#baa167':'#24202a','#9781ab');if(t.done)text('✓',p.x+20,y,n.w,12,'#18131d',1);text(t.text,p.x+45,y,n.w-62,14,t.done?'#8d8397':'#ded7e6',2);text(t.owner,p.x+45,y+37,n.w-62,10,'#a796b4',1);y+=78;}return;}
 text(n.title,p.x+18,p.y+43,n.w-36,22,n.ink,4,true);text(n.text,p.x+18,p.y+110,n.w-36,13,n.ink,Math.floor((n.h-126)/18));}
 for(const n of b.objects.filter(n=>!n.parentId))await draw(n);for(const e of b.edges){const{p,q}=edgeEnds(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.stroke();text(e.label,(p.x+q.x)/2,(p.y+q.y)/2-10,180,11,e.color,1);}
 canvas.toBlob(blob=>{if(blob){download(blob,'notespace-'+b.id+'.png');toast('PNG overview exported. GIF animation remains in the editable board.','success');}},'image/png');}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{applyCamera();},120);});
// Small, intentional testing/extension surface. No credentials or remote authority.
window.NotespacePOC={getBoard:()=>M.clone(state.board),getCamera:()=>({...state.camera}),createObject,fitBoard,select,loadBoard,flush:()=>state.saveQueue,getAssets:()=>dbAll('assets'),state};
init();
})();
